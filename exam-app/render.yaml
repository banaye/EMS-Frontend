# In your frontend repo root
services:
  - type: static
    name: examify-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishDirectory: dist
    envVars:
      - key: VITE_API_URL
        value: https://examify-backend.onrender.com/api
      - key: VITE_APP_NAME
        value: Examify
    routes:
      - type: rewrite
        source: /*
        destination: /index.html